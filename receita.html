<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YumiZoo Receitas - Bolos e Tortas</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="receitas.css">
</head>

<body>

    <header class="header-receitas">
        <a href="index.html" style="text-decoration: none; color: inherit;">
            <div class="logo-container">
                <h1 class="logo-text">Yumi<span class="zoo">Zoo</span></h1>
                <span class="subtext-receitas">Receitas</span>
            </div>
        </a>

        <button class="profile-button" aria-label="Perfil do Usuário">
            <svg class="profile-icon" viewBox="0 0 24 24">
                <path d="M20 21v-1.5a4.5 4.5 0 0 0-4.5-4.5h-7A4.5 4.5 0 0 0 4 19.5V21" />
                <circle cx="12" cy="7" r="4.5" />
            </svg>
        </button>
    </header>

    <div class="app-container">

        <aside class="sidebar-filters">
            <div class="category-header">
                <svg class="icon-cake" viewBox="0 0 24 24">
                    <path d="M2 22h20M17 14.5a5 5 0 0 0-10 0V18h10zm-8-6a3 3 0 0 1 6 0V10H9zM12 2v2" />
                </svg>
                <span>Bolos e Tortas</span>
            </div>

            <div>
                <h3 class="filter-group-title">Tempo</h3>
                <div class="filter-options">
                    <label class="filter-label"><input type="checkbox"> 0-15 min</label>
                    <label class="filter-label"><input type="checkbox"> 15-45 min</label>
                    <label class="filter-label"><input type="checkbox"> 45-1h</label>
                    <label class="filter-label"><input type="checkbox"> + 1h</label>
                </div>
            </div>

            <div>
                <h3 class="filter-group-title">Dificuldade</h3>
                <div class="filter-options">
                    <label class="filter-label"><input type="checkbox"> Fácil</label>
                    <label class="filter-label"><input type="checkbox"> Médio</label>
                    <label class="filter-label"><input type="checkbox"> Chef</label>
                </div>
            </div>
        </aside>

        <main class="content-area">

            <div class="search-wrapper">
                <input type="text" class="search-input" placeholder="buscar em &ldquo;doces&rdquo;">
                <button class="search-button" aria-label="Buscar">
                    <svg class="icon-search" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>

            <div class="recipes-grid">

                <article class="recipe-card">
                    <button class="favorite-btn" aria-label="Favoritar">
                        <svg class="icon-heart" viewBox="0 0 24 24">
                            <path
                                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                            </path>
                        </svg>
                    </button>
                    <div class="recipe-image-box">
                        <img src="https://bakespot.com.br/wp-content/uploads/2018/11/Bolo-tradicional-de-Chocolate-com-calda-de-chocolate-1.jpg"
                            alt="Bolo de Chocolate Cremoso">
                    </div>
                    <div class="recipe-card-body">
                        <h4 class="recipe-title">Bolo de Chocolate Cremoso</h4>
                        <div class="recipe-card-footer">
                            <div class="meta-item">
                                <svg class="icon-meta" viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <polyline points="12 6 12 12 16 14"></polyline>
                                </svg>
                                <span>15 min</span>
                            </div>
                            <div class="meta-item">
                                <svg class="icon-meta icon-star" viewBox="0 0 24 24">
                                    <polygon
                                        points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
                                    </polygon>
                                </svg>
                                <span>4.8</span>
                            </div>
                        </div>
                    </div>
                </article>

            </div>
        </main>
    </div>

</body>

</html>
